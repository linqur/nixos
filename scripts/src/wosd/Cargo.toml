[package]
name = "wosd"
version = "0.1.0"
edition = "2024"

[dependencies]
fontdue = "0.9.5"
rustix = { version = "1.1.5", features = ["event", "fs", "net", "process"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[profile.release]
strip = true
lto = true
